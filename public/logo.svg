<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#110321" />
    </linearGradient>
    
    <!-- Violet Glow/Accent Gradient -->
    <linearGradient id="violet-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Shield/Protection Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="220" stroke="url(#ring-grad)" stroke-width="4" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="220" stroke="url(#ring-grad)" stroke-width="8" stroke-opacity="0.1" filter="url(#glow)" />

  <!-- Inner Glowing Violet Orb -->
  <circle cx="256" cy="256" r="160" fill="url(#bg-grad)" stroke="url(#violet-accent)" stroke-width="2" />
  
  <!-- Central Emblem Group: Shield + Heart/Alert Signal -->
  <g filter="url(#glow)">
    <!-- Protective Shield Base -->
    <path d="M256 120 C310 120 370 140 370 180 C370 270 310 350 256 380 C202 350 142 270 142 180 C142 140 202 120 256 120 Z" 
          fill="url(#shield-grad)" 
          fill-opacity="0.15" 
          stroke="url(#shield-grad)" 
          stroke-width="6" 
          stroke-linejoin="round" />

    <!-- Alerta Violeta Heart / Hand (Concepto de Ayuda) -->
    <path d="M256 190 C256 190 220 154 190 184 C160 214 190 264 256 314 C322 264 352 214 322 184 C292 154 256 190 256 190 Z" 
          fill="url(#violet-accent)" />

    <!-- Pulse Signal Waves -->
    <path d="M256 220 A 30 30 0 0 1 256 280" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8" opacity="0.8" />
    <path d="M256 200 A 50 50 0 0 1 256 300" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>
  
  <!-- Sleek Dot Details -->
  <circle cx="256" cy="70" r="6" fill="#f472b6" />
  <circle cx="256" cy="442" r="6" fill="#6366f1" />
  <circle cx="70" cy="256" r="6" fill="#a78bfa" />
  <circle cx="442" cy="256" r="6" fill="#c084fc" />
</svg>
